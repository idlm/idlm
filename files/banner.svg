<svg xmlns="http://www.w3.org/2000/svg" width="880" height="140" viewBox="0 0 880 140" role="img" aria-label="idlm@github — access granted">
  <title>idlm terminal banner</title>
  <defs>
    <pattern id="scan" width="880" height="4" patternUnits="userSpaceOnUse">
      <rect width="880" height="2" fill="#00ff41" opacity=".035"/>
    </pattern>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00ff41" stop-opacity=".18"/>
      <stop offset="1" stop-color="#00ff41" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="880" height="140" fill="#050805"/>
  <rect width="880" height="140" fill="url(#glow)"/>
  <rect width="880" height="140" fill="url(#scan)"/>
  <rect x="8" y="8" width="864" height="124" fill="none" stroke="#00ff41" stroke-opacity=".55" stroke-width="1.2"/>
  <rect x="12" y="12" width="856" height="116" fill="none" stroke="#00ff41" stroke-opacity=".18" stroke-width="1"/>

  <text font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#3d8a3d" x="28" y="34">root@idlm:~# ./identify</text>
  <text font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="36" font-weight="700" fill="#00ff41" x="28" y="78" letter-spacing="4">FX / IDLM</text>
  <text font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#7CFF9A" x="28" y="104">ACCESS GRANTED  ·  personal agent systems  ·  keep quiet</text>
  <g fill="#00ff41">
    <rect x="820" y="24" width="8" height="8"/>
    <rect x="832" y="24" width="8" height="8" opacity=".45"/>
    <rect x="844" y="24" width="8" height="8" opacity=".2"/>
  </g>
  <rect x="28" y="116" width="9" height="14" fill="#00ff41">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
