  <rect x=".5" y=".5" width="77" height="19" rx="2.5" fill="none" stroke="#00ff41" stroke-opacity=".7"/>
  <circle cx="11" cy="10" r="3" fill="#00ff41">
    <animate attributeName="opacity" values="1;.25;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
