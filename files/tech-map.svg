<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520" role="img" aria-label="Tech and interests map: Agent Engineering, Personal OS, Agent UI, Prompt Orchestration, Skills, FullStack">
  <title>Tech &amp; Interests Map</title>
  <style>
    .h    { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-weight: 700; fill: #00ff41; }
    .sub  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #3d8a3d; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .think   { animation: blink 1.4s steps(1) infinite; }
    .scan { animation: scan 3.6s linear infinite; }
    @keyframes blink { 0%, 60% { opacity: 1; } 61%, 100% { opacity: .25; } }
    @keyframes scan { from { transform: translateY(-520px); } to { transform: translateY(520px); } }
    @media (prefers-reduced-motion: reduce) { .think, .scan { animation: none; } }
  </style>
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#00ff41" stroke-opacity=".06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="880" height="520" fill="#050805"/>
  <rect width="880" height="520" fill="url(#grid)"/>
  <rect class="scan" x="0" y="0" width="880" height="18" fill="#00ff41" opacity=".04"/>

  <!-- connectors -->
  <g fill="none" stroke-width="1.5" stroke-linecap="round">
    <path d="M392 226 C 356 226, 370 84, 332 84" stroke="#00ff41" stroke-opacity=".55"/>
    <path d="M392 248 C 360 248, 366 252, 332 252" stroke="#7CFF9A" stroke-opacity=".55"/>
    <path d="M410 278 C 410 360, 332 366, 332 426" stroke="#3d8a3d"/>
    <path d="M452 278 C 452 380, 600 410, 628 460" stroke="#00ff41" stroke-width="1.2" stroke-dasharray="3 5" stroke-opacity=".45"/>
    <path d="M488 226 C 522 226, 512 110, 548 110" stroke="#00ff41"/>
    <path d="M488 250 C 524 250, 512 326, 548 326" stroke="#00ff41"/>
  </g>
  <g>
    <circle cx="332" cy="84" r="3" fill="#00ff41"/>
    <circle cx="332" cy="252" r="3" fill="#7CFF9A"/>
    <circle cx="332" cy="426" r="3" fill="#3d8a3d"/>
    <circle cx="628" cy="460" r="3" fill="#00ff41"/>
    <circle cx="548" cy="110" r="3" fill="#00ff41"/>
    <circle cx="548" cy="326" r="3" fill="#00ff41"/>
  </g>

  <!-- center node -->
  <g>
    <rect x="392" y="202" width="96" height="76" rx="4" fill="#031403" stroke="#00ff41" stroke-width="1.5"/>
    <text class="mono" x="440" y="228" font-size="9" fill="#3d8a3d" text-anchor="middle">root@idlm</text>
    <text class="mono" x="440" y="248" font-size="14" fill="#00ff41" text-anchor="middle" font-weight="700">FX</text>
    <text class="mono" x="440" y="266" font-size="10" fill="#7CFF9A" text-anchor="middle">idlm</text>
  </g>

  <!-- Agent Engineering: agent session -->
  <g>
    <rect x="548" y="28" width="300" height="190" rx="4" fill="#031403" stroke="#00ff41" stroke-width="1.2"/>
    <circle cx="568" cy="50" r="4" fill="#ff4d4d"/>
    <circle cx="584" cy="50" r="4" fill="#f2c94c"/>
    <circle cx="600" cy="50" r="4" fill="#00ff41"/>
    <text class="mono" x="618" y="54" font-size="11" fill="#3d8a3d">tty/agent</text>
    <line x1="549" y1="64" x2="847" y2="64" stroke="#00ff41" stroke-opacity=".2"/>
    <text class="mono" x="566" y="92" font-size="12" fill="#00ff41">&gt;</text>
    <text class="mono" x="580" y="92" font-size="12" fill="#7CFF9A">./keep_quiet --ship</text>
    <g class="think">
      <text class="mono" x="566" y="114" font-size="12" fill="#3d8a3d">[ * ] compiling context…</text>
    </g>
    <circle cx="570" cy="132" r="2.6" fill="#00ff41"/>
    <text class="mono" x="580" y="136" font-size="12" fill="#d7ffd7">personal AI operating system</text>
    <circle cx="570" cy="154" r="2.6" fill="#7CFF9A"/>
    <text class="mono" x="580" y="158" font-size="12" fill="#7CFF9A">grok · claude-code · codex</text>
    <circle cx="570" cy="176" r="2.6" fill="#3d8a3d"/>
    <text class="mono" x="580" y="180" font-size="12" fill="#3d8a3d">prompt harness · skill bench</text>
    <text class="mono" x="566" y="202" font-size="12" fill="#00ff41">[ok] code · create · quiet</text>
  </g>

  <!-- Personal OS -->
  <g>
    <rect x="548" y="268" width="300" height="118" rx="4" fill="#031403" stroke="#00ff41" stroke-width="1.2"/>
    <text class="h" x="564" y="294" font-size="14">/sys/personal-os</text>
    <text class="sub" x="564" y="313" font-size="11">private agent stack · offline first</text>
    <g>
      <rect x="564" y="336" width="80" height="28" rx="2" fill="#00ff41"/>
      <text class="mono" x="604" y="354" font-size="10.5" fill="#031403" text-anchor="middle">PAIOS</text>
      <rect x="654" y="336" width="80" height="28" rx="2" fill="none" stroke="#00ff41"/>
      <text class="mono" x="694" y="354" font-size="10.5" fill="#00ff41" text-anchor="middle">Offline OS</text>
      <rect x="744" y="336" width="86" height="28" rx="2" fill="none" stroke="#00ff41"/>
      <text class="mono" x="787" y="354" font-size="10.5" fill="#00ff41" text-anchor="middle">JKOS</text>
    </g>
  </g>

  <!-- Agent UI -->
  <g>
    <rect x="32" y="36" width="300" height="96" rx="4" fill="#031403" stroke="#00ff41" stroke-width="1.2"/>
    <text class="h" x="48" y="60" font-size="14">/ui/agent</text>
    <text class="mono" x="48" y="80" font-size="10" fill="#3d8a3d">conversation · workflow · design system</text>
    <g>
      <rect x="48" y="94" width="86" height="22" fill="none" stroke="#00ff41"/>
      <text class="mono" x="91" y="109" font-size="11" fill="#00ff41" text-anchor="middle">Bynnwong</text>
      <rect x="142" y="94" width="110" height="22" fill="none" stroke="#00ff41"/>
      <text class="mono" x="197" y="109" font-size="11" fill="#00ff41" text-anchor="middle">idlm.github.io</text>
    </g>
  </g>

  <!-- Prompt / Image -->
  <g>
    <rect x="32" y="200" width="300" height="104" rx="4" fill="#031403" stroke="#00ff41" stroke-width="1.2"/>
    <text class="h" x="48" y="226" font-size="14">/lab/prompt</text>
    <text class="sub" x="48" y="245" font-size="11">orchestration &amp; image backends</text>
    <g>
      <rect x="48" y="264" width="128" height="24" rx="2" fill="none" stroke="#00ff41"/>
      <text class="mono" x="112" y="280" font-size="10.5" fill="#00ff41" text-anchor="middle">FastAPI + Next.js</text>
      <rect x="184" y="264" width="88" height="24" rx="2" fill="none" stroke="#00ff41"/>
      <text class="mono" x="228" y="280" font-size="10.5" fill="#00ff41" text-anchor="middle">multi-vendor</text>
    </g>
  </g>

  <!-- Quiet writing / homepage -->
  <g>
    <rect x="32" y="372" width="300" height="108" rx="4" fill="#031403" stroke="#00ff41" stroke-width="1.2"/>
    <text class="mono" x="48" y="398" font-size="12" fill="#3d8a3d"># ~/.motto</text>
    <text class="h" x="48" y="424" font-size="18">KEEP QUIET</text>
    <text class="mono" x="48" y="448" font-size="13" fill="#7CFF9A">do the work in silence</text>
    <text class="sub" x="48" y="468" font-size="11">agents · personal OS · quiet craft</text>
  </g>

  <!-- FullStack: tiny terminal -->
  <g>
    <rect x="628" y="428" width="220" height="64" rx="4" fill="#031403" stroke="#00ff41" stroke-width="1.2"/>
    <text class="mono" x="644" y="448" font-size="10" fill="#3d8a3d">/bin/fullstack</text>
    <text class="h" x="644" y="474" font-size="13">just enough</text>
    <rect x="820" y="458" width="8" height="14" fill="#00ff41">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
