<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520" role="img" aria-label="Tech and interests map: Agent Engineering, Personal OS, Agent UI, Prompt Orchestration, Skills, FullStack">
  <title>Tech &amp; Interests Map</title>
  <style>
    .h    { font-family: 'Poppins','Avenir Next','Trebuchet MS',Arial,sans-serif; font-weight: 600; fill: #141413; }
    .sub  { font-family: 'Lora',Georgia,serif; font-style: italic; fill: #87857c; }
    .mono { font-family: 'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; }
    .serif{ font-family: 'Lora',Georgia,serif; }
    .think   { animation: blink 1.4s steps(1) infinite; }
    .balloon { animation: bob 2.8s ease-in-out infinite alternate; }
    .b2 { animation-delay: .7s; }
    .b3 { animation-delay: 1.3s; }
    @keyframes blink { 0%, 60% { opacity: 1; } 61%, 100% { opacity: .25; } }
    @keyframes bob   { from { transform: translateY(0); } to { transform: translateY(-3.5px); } }
    @media (prefers-reduced-motion: reduce) { .think, .balloon { animation: none; } }
  </style>

